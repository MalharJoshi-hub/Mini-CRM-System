name: CRM Intelligence Test Pipeline & CI/CD

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit, Integration & API Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: mini_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify PostgreSQL connectivity & apply schema
        env:
          PGPASSWORD: postgres123
        run: |
          psql -h localhost -U postgres -d mini_crm -f db/schema.sql
          psql -h localhost -U postgres -d mini_crm -f db/seed.sql

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/mini_crm
          JWT_SECRET: testing-jwt-secret-key-32-chars-long
          NODE_ENV: test
        run: npm test

      - name: Verify Production Next.js Build
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/mini_crm
          JWT_SECRET: testing-jwt-secret-key-32-chars-long
        run: npm run build

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
